[project]
name = "threatgraph"
version = "0.1.0"
description = "AI-powered threat intelligence and investigation platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Day 2
    "anthropic>=0.40",
    "dnspython>=2.7",
    "aiohttp>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL and Redis",
    "reliability: kills workers mid-flight; requires the full stack",
    "e2e: requires the full stack and network access",
    "ai_eval: calls the live Claude API and costs money (excluded by default)",
]
# AI evaluation tests are opt-in: they are nondeterministic and billable.
addopts = "-m 'not ai_eval'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults. FastAPI's dependency
# injection is expressed exactly that way (`db: Database = Depends(get_db)`),
# so the rule is a false positive throughout the API layer.
ignore = ["B008"]
